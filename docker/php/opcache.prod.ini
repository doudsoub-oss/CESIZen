; Configuration OPcache de production (L11, engagement 3.1).
; validate_timestamps=0 : le code ne change pas dans une image immuable ; on
; évite tout stat() de fichier à chaque requête. À NE JAMAIS utiliser en
; développement (le code ne serait jamais rechargé).
opcache.enable=1
opcache.enable_cli=0
opcache.validate_timestamps=0
opcache.memory_consumption=192
opcache.max_accelerated_files=20000
opcache.interned_strings_buffer=16
